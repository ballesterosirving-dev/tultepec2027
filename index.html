<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#b3282d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tultepec27">
    <title>Tultepec 27 - C4 Inteligencia</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root { --morena: #b3282d; --bg: #f3f4f6; --text-main: #111827; --text-muted: #6b7280; --border: #e5e7eb; }
        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); height: 100vh; overflow: hidden; }
        
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { width: 90%; max-width: 350px; text-align: center; }
        .login-box h1 { color: var(--morena); border-bottom: 3px solid var(--morena); padding-bottom: 10px; margin-bottom: 30px; font-size: 26px; }
        .login-input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; box-sizing: border-box; background: #f9fafb; text-align: center; }
        .btn-login { width: 100%; padding: 15px; background: var(--morena); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        
        #app-screen { display: none; height: 100%; flex-direction: row; }
        #sidebar { width: 400px; background: white; padding: 20px; box-shadow: 4px 0 10px rgba(0,0,0,0.05); overflow-y: auto; z-index: 1000; display: flex; flex-direction: column; }
        #map { flex-grow: 1; height: 100%; position: relative; z-index: 1; }
        
        .header-c4 { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--morena); padding-bottom: 12px; margin-bottom: 15px; }
        .header-c4 h2 { margin: 0; font-size: 20px; color: var(--text-main); }
        .user-badge { background: #f9fafb; border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 11px; font-weight: bold; color: var(--morena); }
        
        /* MEJORA 2: Estilos del Buscador para Celular */
        #buscador { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #d1d5db; font-size: 13px; color: #333; background: white; margin-bottom: 15px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        #buscador optgroup { font-size: 11px; color: var(--text-muted); font-weight: bold; }
        #buscador option { font-size: 13px; color: var(--text-main); }

        .ficha-tecnica { font-size: 14px; color: #333; }
        .ficha-tecnica p { margin: 10px 0; border-bottom: 1px solid #f3f4f6; padding-bottom: 8px; word-wrap: break-word; }
        .ficha-tecnica strong { color: var(--text-muted); display: block; margin-bottom: 2px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .badge { display: inline-block; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; margin-top: 5px; text-align: center; }
        .bg-mantener { background-color: #f59e0b; } .bg-movilizar { background-color: #ef4444; } .bg-persuadir { background-color: #3b82f6; } .bg-gestion { background-color: #10b981; } .bg-blindaje { background-color: #8b5cf6; }

        .btn-accion { display: block; width: 100%; padding: 14px; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: center; margin-top: 10px; font-size: 14px; }
        .btn-ruta { background: #3b82f6; } .btn-wa { background: #25D366; } .btn-mapa { background: var(--text-main); }
        
        .instruccion-box { background: #f9fafb; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-top: 15px; border-left: 4px solid #25D366;}
        .instruccion-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; margin-top: 5px; box-sizing: border-box; }

        .pulsing-marker { animation: pulse 1.2s infinite alternate; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.6); opacity: 1; } }

        @media (max-width: 768px) {
            #app-screen { flex-direction: column; }
            #sidebar { width: 100%; height: 60vh; order: 2; border-radius: 20px 20px 0 0; margin-top: -25px; box-shadow: 0 -5px 20px rgba(0,0,0,0.15); }
            #map { width: 100%; height: 40vh; order: 1; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1>📍 C4 - TULTEPEC 27</h1>
            <p style="color: #6b7280; font-size: 14px; margin-bottom: 20px;">Acceso Restringido</p>
            <input type="text" id="user" class="login-input" placeholder="Usuario Operativo" autocomplete="off" autocapitalize="off">
            <input type="password" id="pin" class="login-input" placeholder="PIN de Seguridad" inputmode="numeric" pattern="[0-9]*">
            <button class="btn-login" onclick="iniciarSesion()">INGRESAR AL TERRITORIO</button>
            <div id="loader" style="display:none; margin-top:15px; font-size:14px; color:#6b7280;">Autenticando y encriptando... ⏳</div>
        </div>
    </div>

    <div id="app-screen">
        <div id="sidebar">
            <div class="header-c4">
                <h2>Tultepec27</h2>
                <span id="user-info" class="user-badge">Cargando...</span>
            </div>
            
            <select id="buscador" onchange="seleccionarSeccion(this.value)">
                <option value="">🔍 Seleccionar Sección...</option>
            </select>

            <div id="details">
                <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 40px;"><em>Autenticación exitosa. Selecciona una sección para iniciar operaciones.</em></p>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        // PEGA AQUÍ TU URL EXACTA DEL PASO ANTERIOR
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMp8JRjJgoo70qYseF8saqlsy1_LhBGwNPLLJyzGJKvPDvZLRcW08xUM6am9aIIsuFaA/exec";
        
        let map; let capaMarcadores; let marcadoresOriginales = {}; let dbSecciones = {}; let datosUsuario = {};

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([19.6842, -99.1286], 13);
            L.control.zoom({ position: 'topright' }).addTo(map);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            capaMarcadores = L.featureGroup().addTo(map);
        }

        async function iniciarSesion() {
            const user = document.getElementById('user').value;
            const pin = document.getElementById('pin').value;
            if(!user || !pin) return alert("Ingresa Usuario y PIN.");
            
            document.getElementById('loader').style.display = "block";
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'login', usuario: user, pin: pin })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    datosUsuario = result;
                    document.getElementById('user-info').innerText = `👤 ${datosUsuario.rol}`;
                    cargarTerritorio();
                } else {
                    alert("Acceso denegado. Credenciales incorrectas.");
                    document.getElementById('loader').style.display = "none";
                }
            } catch (error) {
                alert("Error de conexión a la Base Maestra.");
                document.getElementById('loader').style.display = "none";
            }
        }

        async function cargarTerritorio() {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'getData', rol: datosUsuario.rol, sector: datosUsuario.sectorPermitido })
                });
                
                const data = await response.json();
                const buscador = document.getElementById('buscador');
                buscador.innerHTML = '<option value="">🔍 Seleccionar Sección...</option>';
                
                let sectores = {};
                
                data.forEach(row => {
                    // MEJORA 4: Detección a prueba de fallos de la columna Teléfono
                    let telReal = row.Telefono || row.Teléfono || row.TELEFONO || row.Tel || "";

                    let lat = 19.684 + (Math.random() * 0.02 - 0.01);
                    let lng = -99.128 + (Math.random() * 0.02 - 0.01);
                    
                    dbSecciones[row.Seccion] = {
                        sector: row.Sector_Geografico_Operativo_Plan_A,
                        col: row.Localidades_Colonias,
                        limites: row.Delimitadores_Geograficos,
                        nse: row.NSE_Pobreza,
                        nominal: row.Lista_Nominal,
                        votacion: row.Votacion_Est,
                        ganador: row.Ganador_Hist,
                        riesgo: row.Prioridad_Riesgo,
                        estrategia: row.Estrategia_Asignada,
                        referente: row.REFERENTE || row.Referente || "No asignado",
                        telefono: telReal,
                        lat: lat, lng: lng
                    };

                    if(!sectores[row.Sector_Geografico_Operativo_Plan_A]) sectores[row.Sector_Geografico_Operativo_Plan_A] = [];
                    sectores[row.Sector_Geografico_Operativo_Plan_A].push(row);
                });

                // Llenar el Dropdown con texto ajustado
                for (let sec in sectores) {
                    let optgroup = document.createElement('optgroup');
                    optgroup.label = (sec || "Sector").substring(0, 30);
                    sectores[sec].forEach(row => {
                        let shortCol = (row.Localidades_Colonias || "").substring(0, 35) + "...";
                        let opt = document.createElement('option');
                        opt.value = row.Seccion;
                        opt.textContent = `${row.Seccion} - ${shortCol}`;
                        optgroup.appendChild(opt);
                    });
                    buscador.appendChild(optgroup);
                }

                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                
                initMap();
                dibujarMarcadores();

            } catch (error) {
                alert("Error al cargar la cartografía.");
            }
        }

        function dibujarMarcadores() {
            capaMarcadores.clearLayers();
            for (let id in dbSecciones) {
                let d = dbSecciones[id];
                let color = '#3b82f6';
                if(d.estrategia) {
                    if(d.estrategia.includes('MANTENER')) color = '#f59e0b';
                    if(d.estrategia.includes('MOVILIZAR')) color = '#ef4444';
                    if(d.estrategia.includes('GESTIÓN')) color = '#10b981';
                    if(d.estrategia.includes('BLINDAJE')) color = '#8b5cf6';
                }
                let m = L.circleMarker([d.lat, d.lng], { radius: 10, fillColor: color, color: '#fff', weight: 2, fillOpacity: 0.9 }).addTo(capaMarcadores);
                m.on('click', () => { document.getElementById('buscador').value = id; seleccionarSeccion(id); });
                marcadoresOriginales[id] = m;
            }
            if(Object.keys(dbSecciones).length > 0) map.fitBounds(capaMarcadores.getBounds(), { padding: [20, 20] });
        }

        function seleccionarSeccion(id) {
            if(!id) return;
            const d = dbSecciones[id];
            
            let colorClass = 'bg-persuadir';
            if(d.estrategia.includes('MANTENER')) colorClass = 'bg-mantener';
            if(d.estrategia.includes('MOVILIZAR')) colorClass = 'bg-movilizar';
            if(d.estrategia.includes('GESTIÓN')) colorClass = 'bg-gestion';
            if(d.estrategia.includes('BLINDAJE')) colorClass = 'bg-blindaje';
            
            let telDisplay = d.telefono ? d.telefono : '<span style="color:#ef4444;">Sin registro en Base</span>';

            document.getElementById('details').innerHTML = `
                <div style="background: var(--morena); color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px;">
                    <h2 style="margin:0; font-size: 18px;">SECCIÓN ${id}</h2>
                    <p style="margin:2px 0 0; font-size:11px; opacity:0.9;">${d.sector}</p>
                </div>
                
                <div class="ficha-tecnica">
                    <p><strong>Referente:</strong> 👤 ${d.referente} <br>📞 ${telDisplay}</p>
                    <p><strong>Colonias:</strong> ${d.col}</p>
                    <p><strong>Delimitadores:</strong> ${d.limites}</p>
                    <p><strong>Lista Nominal:</strong> ${d.nominal} personas</p>
                    <p><strong>Prioridad / Riesgo:</strong> ${d.riesgo}</p>
                    <p><strong>Estrategia:</strong><br><span class="badge ${colorClass}">${d.estrategia}</span></p>
                    
                    <div class="instruccion-box">
                        <strong>📲 Despliegue Táctico:</strong>
                        <input type="text" id="instruccion_${id}" class="instruccion-input" placeholder="Ej: Reforzar barrido en zona norte...">
                        <button class="btn-accion btn-wa" onclick="enviarWhatsApp('${id}')">Enviar Misión por WhatsApp</button>
                    </div>
                    <button class="btn-accion btn-ruta" onclick="trazarRuta(${d.lat}, ${d.lng})">📍 Trazar Ruta (Google Maps)</button>
                </div>
            `;

            for (let s in marcadoresOriginales) {
                let m = marcadoresOriginales[s];
                if (s === id) { m.setStyle({ radius: 15, fillOpacity: 1 }); m.bringToFront(); if(m.getElement()) m.getElement().classList.add('pulsing-marker'); }
                else { m.setStyle({ radius: 7, fillOpacity: 0.3 }); if(m.getElement()) m.getElement().classList.remove('pulsing-marker'); }
            }
            map.flyTo([d.lat, d.lng], 16, { animate: true, duration: 1.5 });
        }

        function enviarWhatsApp(id) {
            const d = dbSecciones[id];
            const instruccion = document.getElementById('instruccion_'+id).value;
            if(!d.telefono || d.telefono.length < 10) {
                alert("No hay un número válido en la Base Maestra para esta sección.");
                return;
            }
            let mensaje = `🚨 *OBJETIVO C4: SECCIÓN ${id}*\n📍 *Sector:* ${d.sector}\n🎯 *Estrategia:* ${d.estrategia}\n👥 *Lista Nominal:* ${d.nominal}\n⚠️ *Prioridad:* ${d.riesgo}\n\n📋 *INSTRUCCIÓN:* ${instruccion || "Acudir a la sección indicada para barrido territorial."}\n\n🗺️ *Ruta:* https://www.google.com/maps/dir/?api=1&destination=$${d.lat},${d.lng}`;
            let encodedMsg = encodeURIComponent(mensaje);
            window.open(`https://wa.me/52${d.telefono}?text=${encodedMsg}`, '_blank');
        }

        function trazarRuta(lat, lng) {
            window.open(`https://www.google.com/maps/dir/?api=1&destination=$${lat},${lng}`, '_blank');
        }
    </script>
</body>
</html>
