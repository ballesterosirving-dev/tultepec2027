        ];

        function renderTable(dataToRender) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            dataToRender.forEach(row => {
                // Cálculo de votación sin errores de precisión (Redondeo a entero)
                const votacionCalculada = Math.round(row.nom * (row.part / 100));
                
                // Lógica de círculo único
                let dotClass = '';
                if(row.r.includes('🔴')) dotClass = 'dot-red';
                else if(row.r.includes('🟡')) dotClass = 'dot-yellow';
                else if(row.r.includes('⚫')) dotClass = 'dot-black';

                // Limpiar el texto para que no salgan emojis dobles si vienen en el string
                const cleanText = row.r.replace(/[🔴🟡⚫]/g, '').trim();

                const htmlRow = `
                    <tr>
                        <td style="text-align:center; font-weight:bold">${row.s}</td>
                        <td title="${row.loc}">${row.loc}</td>
                        <td>${row.ref}</td>
                        <td title="${row.del}">${row.del}</td>
                        <td style="text-align:center">${row.tipo}</td>
                        <td style="text-align:center">${row.nse}</td>
                        <td style="text-align:right">${row.nom.toLocaleString()}</td>
                        <td style="text-align:center">${row.part}%</td>
                        <td style="text-align:right; font-weight:bold; color:#b45309">${votacionCalculada.toLocaleString()}</td>
                        <td style="text-align:center; font-weight:bold; color:${row.win === 'MORENA' ? '#991b1b' : '#1e40af'}">${row.win}</td>
                        <td><span class="status-dot ${dotClass}"></span>${cleanText}</td>
                        <td style="text-align:center">${row.m}</td>
                    </tr>
                `;
                tableBody.insertAdjacentHTML('beforeend', htmlRow);
            });
        }

        function filterTable() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const filteredData = rawData.filter(item => 
                item.s.toString().includes(input) || 
                item.loc.toLowerCase().includes(input) ||
                item.ref.toLowerCase().includes(input) ||
                item.r.toLowerCase().includes(input)
            );
            renderTable(filteredData);
        }

        renderTable(rawData);
