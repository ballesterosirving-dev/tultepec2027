<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Inteligencia Territorial</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f3f4f6; height: 100vh; overflow: hidden; color: #333; }
        
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { width: 90%; max-width: 320px; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; text-align: center; border-radius: 6px;}
        .btn-login { width: 100%; padding: 12px; background: #111; color: white; border: none; font-size: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; border-radius: 6px; }
        .btn-login:active { background: #333; }
        
        #app-screen { display: none; height: 100%; flex-direction: row; }
        #sidebar { width: 380px; background: #f9fafb; padding: 20px; border-right: 1px solid #e5e7eb; overflow-y: auto; z-index: 1000; display: flex; flex-direction: column; }
        #map { flex-grow: 1; height: 100%; position: relative; z-index: 1; }
        
        /* BUSCADOR: Letra más pequeña y fina para móvil */
        #buscador { width: 100%; padding: 10px; border: 1px solid #ccc; font-size: 12px; color: #333; background: white; margin-bottom: 5px; border-radius: 6px; }
        #buscador optgroup { font-size: 12px; font-weight: bold; color: #111; }
        #buscador option { font-size: 11px; color: #444; }
        
        .tarjeta-blanca { background: #ffffff; border: 1px solid #ccc; padding: 15px; margin-top: 15px; font-size: 12px; line-height: 1.5; border-radius: 6px;}
        .tarjeta-blanca p { margin: 5px 0; }
        .tarjeta-blanca strong { color: #000; }
        
        .btn-accion { display: block; width: 100%; padding: 12px; color: #000; border: 1px solid #ccc; background: #f9fafb; cursor: pointer; text-align: center; margin-top: 10px; font-size: 12px; text-decoration: none; border-radius: 6px; font-weight: bold;}
        .btn-accion:active { background: #e5e7eb; }
        
        .instruccion-input { width: 100%; padding: 10px; border: 1px solid #ccc; font-size: 13px; margin-top: 10px; margin-bottom: 5px; box-sizing: border-box; border-radius: 6px;}

        @media (max-width: 768px) {
            #app-screen { flex-direction: column; }
            #sidebar { width: 100%; height: 50vh; order: 2; padding: 15px; border-right: none; border-top: 1px solid #ccc; }
            #map { width: 100%; height: 50vh; order: 1; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <input type="text" id="user" class="login-input" placeholder="Usuario" autocomplete="off" autocapitalize="off">
            <input type="password" id="pin" class="login-input" placeholder="PIN" inputmode="numeric" pattern="[0-9]*">
            <button class="btn-login" onclick="iniciarSesion()">Acceder</button>
            <div id="loader" style="display:none; margin-top:15px; font-size:13px; color:#666; text-align:center;">Validando Seguridad...</div>
        </div>
    </div>

    <div id="app-screen">
        <div id="sidebar">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span style="font-size: 14px; font-weight: bold; color: #111;">Operación Territorial</span>
                <span id="user-info" style="font-size: 11px; color: #666; border: 1px solid #ccc; padding: 3px 8px; border-radius: 4px;"></span>
            </div>
            
            <select id="buscador" onchange="seleccionarSeccion(this.value)">
                <option value="">Seleccionar Sección...</option>
            </select>

            <div id="details">
                <p style="font-size: 12px; color: #666; text-align: center; margin-top: 30px;">Seleccione una sección para iniciar el despliegue.</p>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMp8JRjJgoo70qYseF8saqlsy1_LhBGwNPLLJyzGJKvPDvZLRcW08xUM6am9aIIsuFaA/exec";
        
        let map; let capaMarcadores; let marcadoresOriginales = {}; let dbSecciones = {}; let datosUsuario = {};

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([19.6842, -99.1286], 13);
            L.control.zoom({ position: 'topright' }).addTo(map);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            capaMarcadores = L.featureGroup().addTo(map);
        }

        async function iniciarSesion() {
            const user = document.getElementById('user').value;
            const pin = document.getElementById('pin').value;
            if(!user || !pin) return;
            
            document.getElementById('loader').style.display = "block";
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'login', usuario: user, pin: pin })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    datosUsuario = result;
                    document.getElementById('user-info').innerText = datosUsuario.rol;
                    cargarTerritorio();
                } else {
                    alert("Credenciales incorrectas.");
                    document.getElementById('loader').style.display = "none";
                }
            } catch (error) {
                alert("Error de conexión con el Servidor Central.");
                document.getElementById('loader').style.display = "none";
            }
        }

        async function cargarTerritorio() {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'getData', rol: datosUsuario.rol, sector: datosUsuario.sectorPermitido })
                });
                
                let data = await response.json();

                const buscador = document.getElementById('buscador');
                buscador.innerHTML = '<option value="">Seleccionar Sección...</option>';
                
                let sectores = {};
                
                data.forEach(row => {
                    if(row.Seccion === '6638' || row.Seccion === 6638) return; 

                    let telReal = row.Telefono || row.Teléfono || row.TELEFONO || row.Tel || "S/N";

                    let lat = 19.684 + (Math.random() * 0.02 - 0.01);
                    let lng = -99.128 + (Math.random() * 0.02 - 0.01);
                    
                    dbSecciones[row.Seccion] = {
                        sector: row.Sector_Geografico_Operativo_Plan_A,
                        col: row.Localidades_Colonias,
                        limites: row.Delimitadores_Geograficos,
                        nse: row.NSE_Pobreza,
                        nominal: row.Lista_Nominal,
                        votacion: row.Votacion_Est,
                        ganador: row.Ganador_Hist,
                        riesgo: row.Prioridad_Riesgo,
                        estrategia: row.Estrategia_Asignada,
                        referente: row.REFERENTE || row.Referente || "No asignado",
                        telefono: telReal,
                        lat: lat, lng: lng
                    };

                    let nombreSector = row.Sector_Geografico_Operativo_Plan_A || "Sin Sector";
                    if(!sectores[nombreSector]) sectores[nombreSector] = [];
                    sectores[nombreSector].push(row);
                });

                // ORDENAMIENTO FORZADO DE SECTORES (A-Z)
                let sectoresOrdenados = Object.keys(sectores).sort((a, b) => {
                    return a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'});
                });

                // Llenado del Buscador con el orden correcto
                sectoresOrdenados.forEach(sec => {
                    let optgroup = document.createElement('optgroup');
                    let shortSector = sec.split("(")[0]; // Corta en el paréntesis para no hacer bulto
                    optgroup.label = shortSector;
                    
                    sectores[sec].forEach(row => {
                        let colFull = row.Localidades_Colonias || "";
                        let shortCol = colFull.substring(0, 30); // 30 caracteres máximo
                        if(colFull.length > 30) shortCol += "...";
                        
                        let opt = document.createElement('option');
                        opt.value = row.Seccion;
                        opt.textContent = `${row.Seccion} - ${shortCol}`;
                        optgroup.appendChild(opt);
                    });
                    buscador.appendChild(optgroup);
                });

                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                
                initMap();
                dibujarMarcadores();

            } catch (error) {
                alert("Error al procesar la base de datos maestra.");
            }
        }

        function dibujarMarcadores() {
            capaMarcadores.clearLayers();
            for (let id in dbSecciones) {
                let d = dbSecciones[id];
                let color = '#333'; 
                let m = L.circleMarker([d.lat, d.lng], { radius: 8, fillColor: color, color: '#fff', weight: 1, fillOpacity: 0.8 }).addTo(capaMarcadores);
                m.on('click', () => { document.getElementById('buscador').value = id; seleccionarSeccion(id); });
                marcadoresOriginales[id] = m;
            }
            if(Object.keys(dbSecciones).length > 0) map.fitBounds(capaMarcadores.getBounds(), { padding: [20, 20] });
        }

        function seleccionarSeccion(id) {
            if(!id) return;
            const d = dbSecciones[id];
            
            document.getElementById('details').innerHTML = `
                <div class="tarjeta-blanca">
                    <p><strong>Sección:</strong> ${id}</p>
                    <p><strong>Sector:</strong> ${d.sector}</p>
                    <p><strong>Referente:</strong> ${d.referente} | <strong>Tel:</strong> ${d.telefono}</p>
                    <p><strong>Colonias:</strong> ${d.col}</p>
                    <p><strong>Delimitadores:</strong> ${d.limites}</p>
                    <p><strong>Lista Nominal:</strong> ${d.nominal}</p>
                    <p><strong>Prioridad:</strong> ${d.riesgo}</p>
                    <p><strong>Estrategia:</strong> ${d.estrategia}</p>
                    
                    <div style="margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 15px;">
                        <input type="text" id="instruccion_${id}" class="instruccion-input" placeholder="Instrucción / Despliegue Táctico...">
                        <button class="btn-accion" style="background:#25D366; color:white; border:none;" onclick="enviarWhatsApp('${id}')">Enviar Misión (WhatsApp)</button>
                        <button class="btn-accion" style="background:#3b82f6; color:white; border:none;" onclick="trazarRuta(${d.lat}, ${d.lng})">📍 Ruta de Acceso (Maps)</button>
                    </div>
                </div>
            `;

            for (let s in marcadoresOriginales) {
                let m = marcadoresOriginales[s];
                if (s === id) { m.setStyle({ radius: 12, fillOpacity: 1 }); m.bringToFront(); }
                else { m.setStyle({ radius: 6, fillOpacity: 0.3 }); }
            }
            map.flyTo([d.lat, d.lng], 16, { animate: true, duration: 1.5 });
        }

        function enviarWhatsApp(id) {
            const d = dbSecciones[id];
            const instruccion = document.getElementById('instruccion_'+id).value || "Atender sección conforme a estrategia.";
            
            if(!d.telefono || d.telefono === "S/N" || d.telefono.length < 10) {
                alert("Número de teléfono no disponible en la Base Maestra.");
                return;
            }
            
            // WHATSAPP MINIMALISTA: Solo Instrucción y Link de Google Maps oficial
            let rutaMaps = `https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}`;
            let mensaje = `*INSTRUCCIÓN SECCIÓN ${id}*\n\n${instruccion}\n\n🗺️ *Ruta:* ${rutaMaps}`;
            
            let encodedMsg = encodeURIComponent(mensaje);
            window.open(`https://wa.me/52${d.telefono}?text=${encodedMsg}`, '_blank');
        }

        function trazarRuta(lat, lng) {
            // URL OFICIAL DE RUTEO EN GOOGLE MAPS
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
        }
    </script>
</body>
</html>
