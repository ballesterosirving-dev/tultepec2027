        .ficha-tecnica strong { color: var(--text-main); display: block; margin-bottom: 4px; font-size: 10px; text-transform: uppercase; color: #6b7280; letter-spacing: 0.5px;}

        .bg-movilizar { background-color: #ef4444; }
        .bg-persuadir { background-color: #3b82f6; }
        .bg-gestion { background-color: #10b981; }
        .bg-blindaje { background-color: #8b5cf6; }
        
        .btn-mapa { display: block; width: 100%; padding: 15px; background: var(--morena); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: center; text-decoration: none; margin-top: 20px; font-size: 14px; box-shadow: 0 4px 6px rgba(179,40,45,0.2); }
        .btn-mapa:hover { background: #8e1f23; }

        .referente-box { margin-top: 20px; padding: 15px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; border-left: 5px solid #10b981; }
        .input-referente { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-top: 8px; box-sizing: border-box;}
        .btn-guardar { width: 100%; padding: 10px; margin-top: 10px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .pulsing-marker { animation: pulse 1.2s infinite alternate; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.6); opacity: 1; } }

        @media (max-width: 768px) {

        function dibujarMarcadores() {
            capaMarcadores.clearLayers();
            for (let id in db) {
                let d = db[id];
                let color = d.estrategia.includes('MANTENER') ? '#f59e0b' : d.estrategia.includes('MOVILIZAR') ? '#ef4444' : d.estrategia.includes('GESTIÓN') ? '#10b981' : d.estrategia.includes('BLINDAJE') ? '#8b5cf6' : '#3b82f6';
                let m = L.circleMarker([d.lat, d.lng], { radius: 10, fillColor: color, color: '#fff', weight: 2, fillOpacity: 0.9 }).addTo(capaMarcadores);
                m.on('click', () => { document.getElementById('buscador').value = id; seleccionarSeccion(id); });
                marcadoresOriginales[id] = m;
            }
        }
        dibujarMarcadores();

        function seleccionarSeccion(id) {
            if(!id) return;
            const d = db[id];
            const color = d.estrategia.includes('MANTENER') ? 'bg-mantener' : d.estrategia.includes('MOVILIZAR') ? 'bg-movilizar' : d.estrategia.includes('GESTIÓN') ? 'bg-gestion' : d.estrategia.includes('BLINDAJE') ? 'bg-blindaje' : 'bg-persuadir';
            
            document.getElementById('details').innerHTML = `
                <div style="background: var(--morena); color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
                    <h2 style="margin:0; font-size: 20px;">SECCIÓN ${id}</h2>
                    <p style="margin:5px 0 0; font-size:11px; opacity:0.9; line-height:1.3;">${d.sector}</p>
                </div>
                <div class="ficha-tecnica">
                    <p><strong>Localidades / Colonias:</strong> ${d.col}</p>
                    <p><strong>Delimitadores Geográficos:</strong> ${d.limites}</p>
                    <p><strong>NSE / Pobreza:</strong> ${d.nse}</p>
                    <div style="display:flex; justify-content:space-between; border-bottom: 1px solid #f3f4f6; padding-bottom: 8px;">
                        <div style="width:50%"><strong>Lista Nominal:</strong> ${d.nominal}</div>
                        <div style="width:50%"><strong>Votación Est:</strong> ${d.votacion} (${d.part})</div>
                    </div>
                    <p><strong>Ganador Histórico:</strong> ${d.ganador}</p>
                    <p><strong>Prioridad / Riesgo:</strong> ${d.riesgo}</p>
                    <p><strong>Estrategia Asignada:</strong><br><span class="badge ${color}">${d.estrategia}</span></p>
                    
                    <div class="referente-box">
                        <strong>Referente Territorial:</strong>
                        <input type="text" id="input_${id}" class="input-referente" value="${d.referente !== 'nan' ? d.referente : 'Por asignar'}">
                        <button class="btn-guardar" onclick="guardarLocal('${id}')">💾 Guardar Cambios</button>
                        <p id="msg_${id}" style="display:none; color:#10b981; font-size:11px; margin-top:8px; font-weight:bold;">¡Actualizado correctamente!</p>
                    </div>
                </div>
                <a href="mapas/${id}.pdf" target="_blank" class="btn-mapa">🗺️ VER CARTOGRAFÍA OFICIAL (PDF)</a>
            `;

            for (let s in marcadoresOriginales) {
                let m = marcadoresOriginales[s];
                if (s === id) { m.setStyle({ radius: 15, fillOpacity: 1 }); m.bringToFront(); if(m.getElement()) m.getElement().classList.add('pulsing-marker'); }
                else { m.setStyle({ radius: 7, fillOpacity: 0.3 }); if(m.getElement()) m.getElement().classList.remove('pulsing-marker'); }
            }
            map.flyTo([d.lat, d.lng], 16, { animate: true, duration: 1.5 });
        }

        function guardarLocal(id) {
            const val = document.getElementById('input_'+id).value;
            db[id].referente = val;
            const msg = document.getElementById('msg_'+id);
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 2500);
        }
    </script>
