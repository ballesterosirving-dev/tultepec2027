<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tultepec 2027 - Inteligencia Territorial</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --morena: #b3282d; --coalicion: #1e3a8a; --bg: #f3f4f6; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; height: 100vh; }
        #sidebar { width: 350px; background: white; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); overflow-y: auto; z-index: 1000; }
        #map { flex-grow: 1; height: 100%; }
        h1 { font-size: 20px; color: #333; border-bottom: 2px solid var(--morena); padding-bottom: 10px; }
        .stat-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 15px; margin-bottom: 15px; border-left: 5px solid var(--morena); }
        .stat-card h3 { margin: 0 0 5px 0; font-size: 14px; color: #6b7280; }
        .stat-card p { margin: 0; font-size: 24px; font-weight: bold; color: #111827; }
        #details { margin-top: 20px; font-size: 14px; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; margin-top: 5px; }
        .bg-mantener { background-color: #f59e0b; }
        .bg-movilizar { background-color: #ef4444; }
        .bg-persuadir { background-color: #3b82f6; }
        .bg-gestion { background-color: #10b981; }
        .bg-blindaje { background-color: #8b5cf6; }
        .btn-mapa { display: block; width: 100%; padding: 10px; background: var(--morena); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-align: center; text-decoration: none; margin-top: 15px; box-sizing: border-box; }
        .btn-mapa:hover { background: #8e1f23; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>📍 Cuarto de Guerra - Tultepec</h1>
        <div class="stat-card">
            <h3>Secciones Operativas</h3>
            <p>44</p>
        </div>
        <div class="stat-card" style="border-left-color: #f59e0b;">
            <h3>Base de Operaciones</h3>
            <p>Sección 5475</p>
        </div>
        
        <div id="details">
            <p><em>Haz clic en el buscador o en el mapa para ver la ficha técnica y la cartografía oficial de la sección.</em></p>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
        
        <h3>Simulador de Búsqueda Rápida</h3>
        <select id="buscador" onchange="updateSidebar(this.value)" style="width: 100%; padding: 8px; border-radius: 4px;">
            <option value="">Selecciona una sección para probar...</option>
            <option value="5475">5475 (Cuarto de Guerra / Tu Zona)</option>
            <option value="5479">5479 (CTM Centro)</option>
            <option value="5454">5454 (Tepetlixco / La Piedad)</option>
            <option value="6932">6932 (Santa Elena Centro)</option>
            <option value="5463">5463 (Residencial Tultepec)</option>
        </select>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map').setView([19.6842, -99.1286], 14);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Base de datos integrada con la matriz oficial (Muestra representativa de los 5 sectores)
        const dataElectoral = {
            "5475": { col: "Zona Céntrica Extendida", ref: "Coordinación General", estrat: "MANTENER", prio: "🟢 Segura / Control", reg: "R1. Bastión Centro" },
            "5452": { col: "Col. Centro / B. El Carmen", ref: "Raúl Portuguez / Leoncio P.", estrat: "MANTENER", prio: "🟡 Media / Voto duro", reg: "R1. Bastión Centro" },
            "5453": { col: "Col. La Cantera / La Morita", ref: "Yolanda Escobedo", estrat: "MANTENER", prio: "🟡 Media / Cohesión", reg: "R1. Bastión Centro" },
            "5478": { col: "U. Hab. San Pablo CTM (Sur)", ref: "Estructura CTM", estrat: "MOVILIZAR", prio: "🔴 Alta / Abstención", reg: "R2. El Granero" },
            "5479": { col: "U. Hab. San Pablo CTM (Centro)", ref: "Armando G. / Alicia", estrat: "MOVILIZAR", prio: "🔴 Alta / Abstención", reg: "R2. El Granero" },
            "5454": { col: "Tepetlixco / Amp. La Piedad", ref: "Yolanda E. / Pilar Z.", estrat: "GESTIÓN", prio: "🔴 Alta / Gestión social", reg: "R3. Franja Ejidal" },
            "5468": { col: "Periferia Surponiente", ref: "Imelda / Ximena / Norma", estrat: "GESTIÓN", prio: "🔴 Alta / Gestión social", reg: "R3. Franja Ejidal" },
            "5463": { col: "Residencial Tultepec", ref: "Martha N. / Sandra L.", estrat: "BLINDAJE", prio: "🟡 Media / Vecinal", reg: "R4. Residencial Histórico" },
            "6937": { col: "Hacienda Real (Norte)", ref: "Martha N. / Sandra L. / Vicky C.", estrat: "BLINDAJE", prio: "🟡 Media / Cerrado", reg: "R4. Residencial Histórico" },
            "6932": { col: "Fracc. Santa Elena (C)", ref: "Teresa / Carlos Galicia", estrat: "PERSUADIR", prio: "⚫ Riesgo", reg: "R5. Nueva Oposición" },
            "6685": { col: "El Bosque Tultepec", ref: "Norma Nubia", estrat: "PERSUADIR", prio: "⚫ Riesgo / Oposición", reg: "R5. Nueva Oposición" }
            // Nota técnica: Aquí están mapeadas las estrategias principales. El sistema soporta las 44.
        };

        function updateSidebar(seccion) {
            if(!seccion) return;
            const data = dataElectoral[seccion] || { col: "Sección Oficial " + seccion, ref: "Por asignar", estrat: "EN ANÁLISIS", prio: "Revisar sábana", reg: "Sin región" };
            const detailsDiv = document.getElementById('details');
            
            let badgeClass = '';
            if(data.estrat === 'MOVILIZAR') badgeClass = 'bg-movilizar';
            else if(data.estrat === 'MANTENER') badgeClass = 'bg-mantener';
            else if(data.estrat === 'PERSUADIR') badgeClass = 'bg-persuadir';
            else if(data.estrat === 'GESTIÓN') badgeClass = 'bg-gestion';
            else if(data.estrat === 'BLINDAJE') badgeClass = 'bg-blindaje';

            // AQUÍ CONECTAMOS CON TU CARPETA DE MAPAS RENOMBRADOS
            const rutaPDF = `mapas/${seccion}.pdf`;

            detailsDiv.innerHTML = `
                <h2 style="margin-bottom: 5px; color: #111827;">Sección ${seccion}</h2>
                <p style="color: #6b7280; font-size: 12px; margin-top: 0;">${data.reg}</p>
                <p><strong>Zonas:</strong> ${data.col}</p>
                <p><strong>Referentes:</strong> ${data.ref}</p>
                <p><strong>Nivel de Riesgo:</strong> ${data.prio}</p>
                <span class="badge ${badgeClass}">${data.estrat}</span>
                
                <a href="${rutaPDF}" target="_blank" class="btn-mapa">
                    🗺️ Abrir Cartografía (PDF)
                </a>
            `;
        }
    </script>
</body>
</html>
