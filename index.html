<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tultepec27 - Inteligencia Territorial</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --morena: #b3282d; --coalicion: #1e3a8a; --bg: #f3f4f6; --text-main: #111827; --text-muted: #6b7280; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; height: 100vh; }
        #sidebar { width: 380px; background: white; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); overflow-y: auto; z-index: 1000; }
        #map { flex-grow: 1; height: 100%; }
        h1 { font-size: 22px; color: var(--text-main); border-bottom: 2px solid var(--morena); padding-bottom: 10px; margin-top: 0; }
        
        /* Ajuste de tamaño solicitado */
        .stat-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px 12px; margin-bottom: 15px; border-left: 4px solid var(--morena); display: inline-block;}
        .stat-card h3 { margin: 0; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card p { margin: 0; font-size: 16px; font-weight: bold; color: var(--text-main); }
        
        .ficha-tecnica { font-size: 13px; color: #333; }
        .ficha-tecnica p { margin: 6px 0; border-bottom: 1px solid #f3f4f6; padding-bottom: 4px; }
        .ficha-tecnica strong { color: var(--text-main); display: inline-block; width: 140px; }
        
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; margin-top: 5px; }
        .bg-mantener { background-color: #f59e0b; }
        .bg-movilizar { background-color: #ef4444; }
        .bg-persuadir { background-color: #3b82f6; }
        
        .btn-mapa { display: block; width: 100%; padding: 12px; background: var(--morena); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-align: center; text-decoration: none; margin-top: 20px; box-sizing: border-box; }
        .btn-mapa:hover { background: #8e1f23; }

        .input-referente { width: calc(100% - 150px); padding: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
        .btn-guardar { padding: 4px 8px; font-size: 11px; background: #10b981; color: white; border: none; border-radius: 3px; cursor: pointer; margin-left: 5px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>📍 Tultepec27</h1>
        <div class="stat-card">
            <h3>Secciones Operativas</h3>
            <p>44 Activas</p>
        </div>
        
        <div style="background: #f3f4f6; padding: 10px; border-radius: 6px; margin-bottom: 15px;">
            <label for="buscador" style="font-size: 12px; font-weight: bold; color: var(--text-main); display: block; margin-bottom: 5px;">Simulador de Búsqueda:</label>
            <select id="buscador" onchange="seleccionarSeccion(this.value)" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #d1d5db;">
                <option value="">Selecciona una sección...</option>
                <option value="5452">5452 (Col. Centro / B. El Carmen)</option>
                <option value="5453">5453 (La Cantera / La Morita)</option>
                <option value="5454">5454 (Tepetlixco / La Piedad)</option>
                <option value="6932">6932 (Fracc. Santa Elena Centro)</option>
                <option value="6937">6937 (Hacienda Real Norte)</option>
            </select>
        </div>

        <div id="details">
            <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 40px;"><em>Selecciona una sección en el buscador para desplegar la inteligencia territorial.</em></p>
        </div>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map').setView([19.6842, -99.1286], 14);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Capa global para almacenar los polígonos cuando subas tu GeoJSON
        let capaGeoJSON; 
        let capaResaltada = null; // Para guardar qué sección está pintada actualmente

        // Base de Datos Estructurada exactamente con tus columnas
        // (Nota: Agregué los datos reales que extraje de tus Excel para estas secciones de muestra)
        const db = {
            "5452": {
                sector: "Sector 2: Centro", seccion: "5452",
                col: "Col. Centro, B. El Carmen, B. San Antonio",
                limites: "N: Moctezuma, S: M. Negrete, E: Insurgentes, O: Nezahualcóyotl",
                tipo: "Urbano", nse: "D+ / Media",
                listaNominal: "4,250", votacionEst: "2,465", part: "58%",
                ganadorHist: "MORENA",
                riesgo: "🟡 Media / Voto duro", estrategia: "MANTENER",
                referente: "Raúl Portuguez, Leoncio"
            },
            "5453": {
                sector: "Sector 2: Centro", seccion: "5453",
                col: "Col. La Cantera, Col. La Morita",
                limites: "N: Camelias, S: Guadalupe, E: H. Galeana, O: Totoltepec",
                tipo: "Urbano", nse: "C- / Media",
                listaNominal: "3,900", votacionEst: "2,145", part: "55%",
                ganadorHist: "MORENA",
                riesgo: "🟡 Media / Cohesión", estrategia: "MANTENER",
                referente: "Yolanda Escobedo"
            },
            "5454": {
                sector: "Sector 4: Franja Ejidal", seccion: "5454",
                col: "Tepetlixco, Amp. La Piedad, B. La Piedad",
                limites: "N: Gladiolas, S: Talleres, E: Insurgentes, O: H. Galeana",
                tipo: "Urbano", nse: "D / Alta",
                listaNominal: "3,850", votacionEst: "1,963", part: "51%",
                ganadorHist: "MORENA",
                riesgo: "🔴 Alta / Gestión social", estrategia: "GESTIÓN",
                referente: "Yolanda Escobedo, Pilar Zuñiga"
            },
            "6932": {
                sector: "Sector 5: Residencial Nuevo", seccion: "6932",
                col: "Fracc. Santa Elena (Centro)",
                limites: "(Polígono Centro Elena)",
                tipo: "Residenc.", nse: "C / Baja",
                listaNominal: "2,600", votacionEst: "1,222", part: "47%",
                ganadorHist: "COALICIÓN",
                riesgo: "⚫ Riesgo / Volatilidad", estrategia: "PERSUADIR",
                referente: "Teresa, Carlos Galicia"
            },
            "6937": {
                sector: "Sector 5: Residencial Nuevo", seccion: "6937",
                col: "Fracc. Hacienda Real de Tultepec",
                limites: "(Polígono Norte Hacienda)",
                tipo: "Residenc.", nse: "C- / Baja",
                listaNominal: "2,400", votacionEst: "1,224", part: "51%",
                ganadorHist: "MORENA",
                riesgo: "🟡 Media / Cerrado", estrategia: "BLINDAJE",
                referente: "Martha Narveza, Sandra Lule"
            }
        };

        function seleccionarSeccion(seccion) {
            if(!seccion) {
                document.getElementById('details').innerHTML = '';
                return;
            }
            
            const data = db[seccion];
            const detailsDiv = document.getElementById('details');
            
            // Determinamos el color de la estrategia
            let badgeClass = 'bg-persuadir'; // default azul
            if(data.estrategia.includes('MANTENER')) badgeClass = 'bg-mantener';
            if(data.estrategia.includes('MOVILIZAR')) badgeClass = 'bg-movilizar';
            if(data.estrategia.includes('GESTIÓN')) badgeClass = 'bg-mantener'; // Verde/Naranja
            
            // Construimos la ruta del mapa
            const rutaPDF = `mapas/${seccion}.pdf`;

            detailsDiv.innerHTML = `
                <div style="background: var(--morena); color: white; padding: 8px 12px; border-radius: 4px; margin-bottom: 15px;">
                    <h2 style="margin: 0; font-size: 16px;">SECCIÓN ${data.seccion}</h2>
                    <p style="margin: 2px 0 0 0; font-size: 11px; opacity: 0.9;">${data.sector}</p>
                </div>

                <div class="ficha-tecnica">
                    <p><strong>Localidades/Colonias:</strong> ${data.col}</p>
                    <p><strong>Delimitadores (N/S/E/O):</strong> ${data.limites}</p>
                    <p><strong>Tipo Asentamiento:</strong> ${data.tipo}</p>
                    <p><strong>NSE / Pobreza:</strong> ${data.nse}</p>
                    <p><strong>Lista Nominal (2026):</strong> ${data.listaNominal}</p>
                    <p><strong>Participación Est.:</strong> ${data.part}</p>
                    <p><strong>Votación Est.:</strong> ${data.votacionEst}</p>
                    <p><strong>Ganador Histórico:</strong> ${data.ganadorHist}</p>
                    <p><strong>Prioridad / Riesgo:</strong> ${data.riesgo}</p>
                    <p><strong>Estrategia:</strong> <span class="badge ${badgeClass}">${data.estrategia}</span></p>
                    
                    <div style="margin-top: 15px; padding: 10px; background: #fff; border: 1px solid #e5e7eb; border-radius: 4px; border-left: 3px solid #10b981;">
                        <p style="margin: 0 0 5px 0;"><strong>Referente Operativo:</strong></p>
                        <input type="text" id="refInput_${seccion}" class="input-referente" value="${data.referente}">
                        <button class="btn-guardar" onclick="guardarReferente('${seccion}')">Guardar</button>
                        <span id="saveMsg_${seccion}" style="display:none; color:#10b981; font-size:10px; margin-left:5px;">¡Guardado!</span>
                    </div>
                </div>
                
                <a href="${rutaPDF}" target="_blank" class="btn-mapa">
                    🗺️ Abrir Cartografía (PDF)
                </a>
            `;

            // Llama a la función para pintar el mapa (explicada abajo)
            resaltarSeccionEnMapa(seccion);
        }

        // Función para simular el guardado del referente
        function guardarReferente(seccion) {
            const nuevoReferente = document.getElementById(`refInput_${seccion}`).value;
            db[seccion].referente = nuevoReferente; // Actualiza la base de datos temporal en memoria
            
            const msg = document.getElementById(`saveMsg_${seccion}`);
            msg.style.display = 'inline';
            setTimeout(() => { msg.style.display = 'none'; }, 2000);
        }

        // Función para Sombrear/Pintar la sección en el mapa
        function resaltarSeccionEnMapa(seccion) {
            // Esta función actuará cuando conectes tu archivo GeoJSON (el dibujo de las calles).
            // Lógica: Si ya hay una sección pintada, le quitamos el color fuerte.
            // Luego, buscamos la sección seleccionada y la pintamos de rojo/guinda.
            
            if(capaGeoJSON) {
                capaGeoJSON.eachLayer(function (layer) {
                    // Restablecemos el estilo de todas
                    capaGeoJSON.resetStyle(layer); 
                    
                    // Si el número de sección del polígono coincide con la búsqueda
                    if (layer.feature.properties.SECCION == seccion) {
                        layer.setStyle({
                            weight: 3,
                            color: '#b3282d', // Borde Guinda
                            fillColor: '#b3282d', // Relleno Guinda
                            fillOpacity: 0.5
                        });
                        // Centramos el mapa visualmente en esa sección
                        map.fitBounds(layer.getBounds());
                    }
                });
            }
        }
    </script>
</body>
</html>
